[project]
name = "yoke"
version = "0.1.0"
description = "Connecting metagenomic species and their functions."
authors = [{ name = "Anthony Duncan", email = "anthony.duncan@earlham.ac.uk" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.1",
    "multimethod>=1.12",
    "networkx>=3.3",
    "pandas>=2.2.2,<3",
    "plotnine>=0.14.5",
    "pyfastx>=2.3.0",
    "scipy>=1.15.2",
    "statsmodels>=0.14.4",
    "tqdm>=4.66.5",
]

[project.scripts]
yoke = "yoke:cli"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.2.1",
    "pytest-cov>=6.0",
    "ruff>=0.14",
    "snakeviz>=2.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
